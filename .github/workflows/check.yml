# Every widget and the catalog index are checked the way Hermes UI's portal will check them (scripts/check.py).
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pinned commits are read from history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema==4.23.0"
      - run: git fetch origin main:refs/remotes/origin/main || true
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/check.py
